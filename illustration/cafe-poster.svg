<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" width="1600" height="2000">
  <!-- palette: navy #1b2742 / ivory #f1e7d3 (dominant) — vermilion #e04a2f / cobalt #2f5fb3 / turquoise #1f9a8b / mustard #e3a72f (accents) -->
  <defs>
    <clipPath id="win">
      <path d="M150 960 V435 A205 205 0 0 1 560 435 V960 Z"/>
    </clipPath>
    <clipPath id="sheet"><rect width="1600" height="2000"/></clipPath>
  </defs>

  <g clip-path="url(#sheet)">
    <!-- ground -->
    <rect width="1600" height="2000" fill="#f1e7d3"/>

    <!-- vermilion disc, cut by the wall plane -->
    <circle cx="1310" cy="640" r="285" fill="#e04a2f"/>

    <!-- navy wall plane -->
    <rect x="0" y="0" width="1080" height="1210" fill="#1b2742"/>

    <!-- arched window -->
    <path d="M150 960 V435 A205 205 0 0 1 560 435 V960 Z" fill="#2f5fb3"/>
    <g clip-path="url(#win)">
      <circle cx="455" cy="420" r="62" fill="#e3a72f"/>
      <circle cx="250" cy="850" r="160" fill="#1f9a8b"/>
      <circle cx="500" cy="780" r="125" fill="#1f9a8b"/>
    </g>
    <rect x="348" y="225" width="14" height="740" fill="#1b2742"/>
    <rect x="150" y="640" width="410" height="14" fill="#1b2742"/>

    <!-- pendant lamp -->
    <rect x="777" y="0" width="6" height="470" fill="#f1e7d3"/>
    <path d="M630 600 A150 150 0 0 1 930 600 Z" fill="#e3a72f"/>
    <path d="M700 600 A80 80 0 0 0 860 600 Z" fill="#f1e7d3"/>

    <!-- plant: geometric leaves over the window edge -->
    <g fill="#1f9a8b">
      <path d="M225 1050 Q120 900 70 720 Q210 850 225 1050 Z"/>
      <path d="M235 1050 Q200 860 270 690 Q320 880 235 1050 Z"/>
      <path d="M245 1050 Q330 900 470 820 Q410 990 245 1050 Z"/>
    </g>
    <path d="M140 1040 H340 L315 1210 H165 Z" fill="#e04a2f"/>

    <!-- figure in profile -->
    <!-- torso -->
    <path d="M1105 1210 L1135 1000 Q1160 905 1265 890 L1430 890 Q1560 905 1640 1000 L1640 1210 Z" fill="#2f5fb3"/>
    <!-- collar accent -->
    <path d="M1255 890 L1345 890 L1300 965 Z" fill="#e3a72f"/>
    <!-- neck -->
    <rect x="1262" y="800" width="66" height="100" fill="#f1e7d3"/>
    <!-- face -->
    <ellipse cx="1290" cy="715" rx="98" ry="122" fill="#f1e7d3"/>
    <path d="M1196 705 L1162 760 L1200 768 Z" fill="#f1e7d3"/>
    <!-- hair -->
    <path d="M1220 620 C1250 560 1390 545 1425 640 C1450 720 1440 820 1420 900 L1340 900 C1365 840 1370 760 1345 700 C1320 650 1265 640 1220 620 Z" fill="#1b2742"/>
    <!-- eye & mouth as minimal marks -->
    <rect x="1222" y="690" width="34" height="10" rx="5" fill="#1b2742"/>
    <rect x="1215" y="792" width="26" height="9" rx="4.5" fill="#e04a2f"/>

    <!-- table edge -->
    <rect x="0" y="1210" width="1600" height="48" fill="#e3a72f"/>

    <!-- tabletop, seen from above -->
    <rect x="0" y="1258" width="1600" height="742" fill="#1b2742"/>

    <!-- placemat (cropped at left/bottom) -->
    <rect x="-40" y="1360" width="800" height="700" fill="#1f9a8b"/>

    <!-- curry plate -->
    <ellipse cx="400" cy="1650" rx="300" ry="205" fill="#f1e7d3"/>
    <path d="M400 1475 A245 165 0 0 0 400 1825 Z" fill="#1b2742"/>
    <path d="M400 1475 A245 165 0 0 1 400 1825 Z" fill="#e3a72f"/>
    <path d="M330 1590 C350 1520 470 1520 500 1580 C530 1650 470 1700 400 1690 C340 1685 315 1640 330 1590 Z" fill="#f1e7d3"/>
    <circle cx="418" cy="1606" r="40" fill="#e04a2f"/>
    <g stroke="#1f9a8b" stroke-width="7" stroke-linecap="round">
      <line x1="470" y1="1660" x2="560" y2="1610"/>
      <line x1="475" y1="1672" x2="575" y2="1655"/>
      <line x1="466" y1="1680" x2="545" y2="1712"/>
    </g>
    <path d="M560 1720 A55 55 0 0 1 640 1650" stroke="#e04a2f" stroke-width="22" fill="none" stroke-linecap="round"/>

    <!-- cutlery: graphic repetition -->
    <g fill="#f1e7d3">
      <ellipse cx="808" cy="1500" rx="32" ry="48"/>
      <rect x="800" y="1540" width="16" height="300" rx="8"/>
      <path d="M855 1840 V1470 Q855 1450 875 1452 Q895 1470 895 1560 L875 1580 V1840 Z"/>
    </g>

    <!-- hot dog on a tilted square of paper -->
    <g transform="rotate(8 1250 1720)">
      <rect x="1000" y="1560" width="500" height="330" fill="#2f5fb3"/>
    </g>
    <g transform="rotate(-14 1240 1720)">
      <rect x="1010" y="1655" width="460" height="130" rx="65" fill="#e3a72f"/>
      <rect x="1040" y="1695" width="400" height="50" rx="25" fill="#e04a2f"/>
      <path d="M1065 1720 L1095 1700 L1125 1740 L1155 1700 L1185 1740 L1215 1700 L1245 1740 L1275 1700 L1305 1740 L1335 1700 L1365 1740 L1395 1700 L1420 1720" stroke="#f1e7d3" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- arm crossing from the upright plane into the tabletop plane -->
    <path d="M1250 985 L1190 1360" stroke="#2f5fb3" stroke-width="118" stroke-linecap="round"/>

    <!-- coffee, cup & saucer from above -->
    <circle cx="1030" cy="1450" r="135" fill="#f1e7d3"/>
    <circle cx="1030" cy="1450" r="96" fill="#e04a2f"/>
    <circle cx="1030" cy="1450" r="80" fill="#1b2742"/>
    <path transform="translate(30 0)" d="M1000 1478 C960 1450 960 1420 984 1418 C994 1417 1000 1426 1000 1432 C1000 1426 1006 1417 1016 1418 C1040 1420 1040 1450 1000 1478 Z" fill="#f1e7d3"/>
    <rect x="1116" y="1428" width="80" height="44" rx="22" fill="#e04a2f"/>
    <!-- hand -->
    <path transform="translate(30 0)" d="M1112 1395 A58 58 0 0 1 1228 1395 L1228 1440 A20 20 0 0 1 1208 1460 L1132 1460 A20 20 0 0 1 1112 1440 Z" fill="#f1e7d3"/>

    <!-- sugar: rhythmic dots -->
    <g fill="#e3a72f" transform="translate(70 0)">
      <circle cx="1240" cy="1350" r="16"/>
      <circle cx="1290" cy="1350" r="16"/>
      <circle cx="1340" cy="1350" r="16"/>
    </g>
  </g>
</svg>
